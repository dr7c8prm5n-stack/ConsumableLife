[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.13"
hilt = "2.60.1"
androidxHilt = "1.3.0"
composeBom = "2026.09.00"
materialIconsExtended = "1.7.8"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigation = "2.10.2"
room = "2.8.4"
